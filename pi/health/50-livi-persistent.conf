# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# with Storage=volatile to spare the SD card. That is why the 2026-08-08/09 trip
# left no evidence: every reboot destroyed the journal, including the boot that
# hung. Ride forensics need the journal to survive a reboot, so override it here
# (/etc/ beats /usr/lib/) with a hard size cap so the card is still protected.
[Journal]
Storage=persistent
Compress=yes
# ~14 rides' worth. 13G free on this card, so 200M is not a risk.
SystemMaxUse=200M
SystemMaxFileSize=20M
SystemKeepFree=1G
MaxRetentionSec=2week
# Default is 5 min. A hang that takes the machine down loses everything written
# since the last sync, and 5 minutes of missing journal is exactly the window we
# care about. 30 s is the compromise against SD wear.
SyncIntervalSec=30s
