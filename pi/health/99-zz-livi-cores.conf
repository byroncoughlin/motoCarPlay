# Cores used to land in /tmp (tmpfs) and died at every reboot, which is
# exactly when the evidence mattered. Keep them on disk instead.
#
# The filename matters. sysctl.d is applied in lexicographic order and the last
# write wins, and this machine already has /etc/sysctl.d/99-core.conf setting
# core_pattern=/tmp/core.%e.%p. This file was originally 60-livi-cores.conf,
# which sorts *before* that one, so it was silently overridden: the drop-in was
# installed, `cat` showed the right value, and /proc/sys/kernel/core_pattern
# still said /tmp. Verify the live value, never the file:
#
#   cat /proc/sys/kernel/core_pattern
#
# The cores directory is size-capped by livi-health-recorder (newest 3, 1 GiB).
# An Electron core here is ~260 MB, so a crash loop would otherwise fill the
# card and take the dash down for a reason unrelated to the original fault.
kernel.core_pattern=/home/byron/LIVI/cores/core.%e.%p.%t
